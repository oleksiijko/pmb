name: CodeQL

# Static application security testing (SAST) — GitHub's CodeQL.
# Free for public repos. Results appear in the repo's Security tab.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly sweep of main, Monday 06:00 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload CodeQL results

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      # Python is a no-build language for CodeQL — no compile step needed.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
