name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs on the same ref — saves Actions minutes on rapid pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------
  # Lint — fast, runs once. BLOCKING (T2): ruff must be clean.
  # --------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "ruff>=0.8"
      - run: ruff check src tests scripts --output-format=github

  # --------------------------------------------------------------
  # Tests — the WHOLE suite on every PR (T1). No curated file lists:
  # a new test file is covered the moment it lands. Genuinely
  # load-flaky tests are marked @pytest.mark.quarantined (with a
  # root-cause note) and run in the separate non-blocking job below.
  # --------------------------------------------------------------
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          # One macOS (arm64) job so the "runs on macOS" claim is tested,
          # without tripling runner minutes across every Python version.
          - os: macos-latest
            python: "3.12"

    # Stability on memory-constrained runners. transformers materialises model
    # weights in several parallel threads (GLOBAL_WORKERS); under the runners'
    # limited RAM that spiked peak memory and segfaulted with a native "access
    # violation" / pagefile-too-small. conftest.py caps GLOBAL_WORKERS=1; these
    # env vars also pin BLAS/tokenizer threads, and faulthandler turns any
    # remaining native crash into a readable Python traceback instead of a bare
    # exit code.
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONFAULTHANDLER: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
            ~\AppData\Local\huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto]"

      # The whole suite, minus quarantined load-flaky tests (run below).
      - name: Full test suite
        run: pytest tests/ -q --tb=short -m "not quarantined"

  # --------------------------------------------------------------
  # Coverage — single cell (tracing slows the matrix). Enforces a
  # measured floor on the engine core; ratchet up at each release,
  # never down. (T3)
  # --------------------------------------------------------------
  coverage:
    name: Coverage floor (core)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
          key: hf-cov-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-cov-
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto]"
      # Measured 2026-06-10: whole-package line coverage = 63% (18047 stmts).
      # Floor = measured − 2. Ratchet UP at each release F-phase, never down.
      - name: Coverage floor (whole package)
        run: >
          pytest tests/ -q -m "not quarantined"
          --cov=pmb --cov-report=term-missing
          --cov-fail-under=61

  # --------------------------------------------------------------
  # Quarantine — load-flaky tests, NON-blocking but VISIBLE. Every
  # entry carries a root-cause note in its marker; most should die
  # once the harness is consolidated (real waits, isolated engines).
  # --------------------------------------------------------------
  quarantine:
    name: Quarantined (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
          key: hf-q-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-q-
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto]"
      - name: Quarantined tests
        run: pytest tests/ -q --tb=short -m "quarantined" || true

  # --------------------------------------------------------------
  # CLI smoke — entry points must work AND exit clean (T4). No
  # `|| true`: stats/doctor are designed to exit 0 on an empty
  # workspace (doctor is non-zero only with --strict).
  # --------------------------------------------------------------
  smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: pmb --help
      - run: pmb config list
      - run: pmb stats
      - run: pmb doctor
      - run: pmb daemon status

  # --------------------------------------------------------------
  # Packs-off gate (G2/G3) — multilingual recall eval + keyed extraction
  # with NO built-in language packs (they were DELETED in G3, so this is
  # now the production default; PMB_DISABLE_DEFAULT_PACKS is redundant but
  # kept as belt-and-suspenders). BLOCKING: RU/UK/de/es/fr recall must hold
  # via the embedder + anchor tier, or CI fails.
  # --------------------------------------------------------------
  packs-off-ratchet:
    name: Packs-off gate (G3)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONFAULTHANDLER: "1"
      PMB_DISABLE_DEFAULT_PACKS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/huggingface
          key: hf-ratchet-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-ratchet-
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,crypto]"
      - name: Multilingual eval + keyed extraction with packs OFF
        run: >
          pytest -q --tb=short
          tests/test_packs_off_ratchet.py
          tests/test_memory_eval_multilingual.py
          tests/test_extract_anchor.py
          tests/test_anchors.py
