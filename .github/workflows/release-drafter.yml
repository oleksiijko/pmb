name: Release Drafter

# Maintains a single draft GitHub Release with notes auto-generated
# from merged PRs. Run on every push to main + on PR events so the
# labeler keeps PR labels in sync as titles/files change.
#
# Config lives in .github/release-drafter.yml.
# To publish: Releases → Draft → edit if needed → Publish.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, edited]
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    name: Update Release Draft
    runs-on: ubuntu-latest
    # Dependabot PRs run with a restricted read-only token, so release-drafter
    # can't read its config or write the draft (it 404s on the org-level
    # fallback). Skip them - the draft still updates on every push to main.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: write          # needed to write draft release
      pull-requests: write     # needed for autolabeler
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
